        #loader {
            position: fixed;

            background-color: #0f172a;
            color: #f8fafc;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>

                if (res.ok) {
                    const data = await res.json();
                    window.__LATEST_STOCKS_DATA__ = data;

        // Dismiss loader when Compose canvas or container is mounted

            const loader = document.getElementById('loader');
            if (loader && loader.parentNode) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    if (loader.parentNode) loader.parentNode.removeChild(loader);
                }, 300);
            }
        }

        function checkReady() {
            if (document.querySelector('canvas')) return true;
            const container = document.getElementById('compose-container');
            if (container && container.firstElementChild) return true;
            return false;
        }

        const observer = new MutationObserver(() => {
            if (checkReady()) {
                dismissLoader();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Polling interval + failsafe timeout
        const readyInterval = setInterval(() => {
            if (checkReady()) {
                dismissLoader();
                clearInterval(readyInterval);
                observer.disconnect();
            }
        }, 100);

            dismissLoader();
            clearInterval(readyInterval);

        // Kotlin Wasm Bridge to register / enrich stock directory
        window.__initStockDirectory = function(jsonStr) {
            try {
                const parsed = JSON.parse(jsonStr);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    const map = new Map();
                    parsed.forEach(item => map.set(item.ticker, item));
                    stockDirectory.forEach(item => {
                        if (!map.has(item.ticker)) map.set(item.ticker, item);
                    });
                    stockDirectory = Array.from(map.values());
                }
            } catch (e) {
                console.warn('[AlphaPredict] Failed to parse stock directory from Wasm:', e);
            }
        };

        let selectedSuggestionIndex = -1;
        let currentSuggestions = [];

        function renderSuggestions(query) {
            const clean = (query || '').trim().toUpperCase();
            if (!clean || !suggestionsDropdown || !suggestionsList) {
                hideSuggestions();
                return;
            }

            // Strictly filter stocks whose ticker starts with the typed prefix (e.g. H -> HPG, HSG... ; HC -> HCM...)
            currentSuggestions = stockDirectory
                .filter(s => s.ticker.startsWith(clean))
                .slice(0, 8);
            selectedSuggestionIndex = -1;

            if (currentSuggestions.length === 0) {
                hideSuggestions();
                return;
            }

            suggestionsList.innerHTML = currentSuggestions.map((item, idx) => `
                <li class="suggestion-item" data-ticker="${item.ticker}" data-index="${idx}" role="option">
                    <div class="suggestion-ticker-badge">${item.ticker}</div>
                    <div class="suggestion-info">
                        <span class="suggestion-name">${item.name}</span>
                        <span class="suggestion-industry">${item.sector || ''}</span>
                    </div>
                    <svg class="suggestion-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </li>
            `).join('');

            suggestionsDropdown.style.display = 'block';
        }

        function hideSuggestions() {
            if (suggestionsDropdown) {
                suggestionsDropdown.style.display = 'none';
            }
            selectedSuggestionIndex = -1;
            currentSuggestions = [];
        }

        function highlightSuggestion(index) {
            if (!suggestionsList) return;
            const items = suggestionsList.querySelectorAll('.suggestion-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // iOS Safari touch event isolation: prevent canvas/document from intercepting tap
        if (searchInput) {
            searchInput.addEventListener('touchstart', function(e) {
                e.stopPropagation();
            }, { passive: true });

            searchInput.addEventListener('touchend', function(e) {
                e.stopPropagation();
                this.focus();
            }, { passive: false });

            searchInput.addEventListener('click', function(e) {
                e.stopPropagation();
                this.focus();
                if (this.value) {
                    renderSuggestions(this.value);
                }
            });

            // Instant autocomplete filtering as user types 1 or 2 characters
            searchInput.addEventListener('input', function(e) {
                const val = e.target.value;
                renderSuggestions(val);
                window.__PENDING_SEARCH_INPUT__ = val;
                window.dispatchEvent(new Event('alpha_search_input'));
            });

            // Keyboard navigation (Arrow keys, Enter, Escape)
            searchInput.addEventListener('keydown', function(e) {
                if (!suggestionsDropdown || suggestionsDropdown.style.display === 'none') {
                    return;
                }

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentSuggestions.length > 0) {
                        selectedSuggestionIndex = (selectedSuggestionIndex + 1) % currentSuggestions.length;
                        highlightSuggestion(selectedSuggestionIndex);
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentSuggestions.length > 0) {
                        selectedSuggestionIndex = (selectedSuggestionIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
                        highlightSuggestion(selectedSuggestionIndex);
                    }
                } else if (e.key === 'Enter') {
                    if (selectedSuggestionIndex >= 0 && selectedSuggestionIndex < currentSuggestions.length) {
                        e.preventDefault();
                        const chosen = currentSuggestions[selectedSuggestionIndex].ticker;
                        hideSuggestions();
                        submitSearch(chosen);
                    }
                } else if (e.key === 'Escape') {
                    hideSuggestions();
                }
            });
        }

        function submitSearch(ticker) {
            hideSuggestions();
            if (!ticker) return;
            const clean = ticker.trim().toUpperCase();
            if (!clean) return;

            if (searchInput) {
                searchInput.value = clean;
                searchInput.blur(); // Dismiss mobile keyboard cleanly
            }

            window.__PENDING_SEARCH_TICKER__ = clean;
            window.dispatchEvent(new Event('alpha_search_submit'));
        }

        if (searchForm) {
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (searchInput) {
                    submitSearch(searchInput.value);
                }
            });
        }

        // Delegate click / touch on suggestions list
        if (suggestionsList) {
            suggestionsList.addEventListener('click', (e) => {
                const item = e.target.closest('.suggestion-item');
                if (item) {
                    const ticker = item.getAttribute('data-ticker');
                    if (ticker) {
                        submitSearch(ticker);
                    }
                }
            });
        }

        // Dismiss dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-field-wrapper')) {
                hideSuggestions();
            }
        });

        // Quick Chips click handler
        document.querySelectorAll('.chip').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const ticker = btn.getAttribute('data-ticker');
                if (ticker) {
                    submitSearch(ticker);
                }
            });

        // Flag Checkbox Toggle Language Switch Handler
        let isEnglish = false;
        const langCheckbox = document.getElementById('lang-switch-checkbox');
        const bctcLabel = document.getElementById('bctc-label');
        const searchBtn = document.getElementById('html-search-btn');
        const chipsLabel = document.querySelector('.chips-label');

        function setLanguage(en) {
            isEnglish = en;
            if (langCheckbox && langCheckbox.checked !== isEnglish) {
                langCheckbox.checked = isEnglish;
            }
            if (isEnglish) {
                if (bctcLabel) bctcLabel.textContent = 'Financials';
                if (searchBtn) searchBtn.textContent = 'Analyze';
                if (chipsLabel) chipsLabel.textContent = 'Popular:';
                if (searchInput) searchInput.placeholder = '🔍 Search stock ticker (HPG, VNM, SSI...)';
            } else {
                if (bctcLabel) bctcLabel.textContent = 'BCTC VAS';
                if (searchBtn) searchBtn.textContent = 'Phân tích';
                if (chipsLabel) chipsLabel.textContent = 'Gợi ý:';
                if (searchInput) searchInput.placeholder = '🔍 Tìm mã cổ phiếu (HPG, VNM, SSI...)';
            }
        }

        if (langCheckbox) {
            langCheckbox.addEventListener('change', () => {
                setLanguage(langCheckbox.checked);
                window.dispatchEvent(new Event('alpha_toggle_language'));
            });
        }

        const bctcBtn = document.getElementById('header-bctc-btn');
        if (bctcBtn) {
            bctcBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.dispatchEvent(new Event('alpha_toggle_custom_dialog'));
            });
        }

        // Wasm-to-HTML synchronization
        window.__syncNativeSearchText = function(text) {
            if (searchInput) {
                searchInput.value = text || '';
            }
        };

        window.__setNativeModalVisible = function(visible) {
            if (visible) {
                document.body.classList.add('modal-open');
            } else {
                document.body.classList.remove('modal-open');
            }
        };

        window.__updateNativeSearchBounds = function() {};
    </script>
    <script type="application/javascript" src="webApp.js?v=20261016_segmented_switch"></script>
</body>
</html>
